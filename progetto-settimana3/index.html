<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pellicula</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>PELLICULA</h1>
      <p>Cosa hai visto e cosa vedrai, il tuo archivio di film personale.</p>
      <button id="btn-tema">Tema scuro</button>
    </header>

    <main>
      <section class="form">
        <h2>Aggiungi un film</h2>
        <form id="form-film">
          <input
            type="text"
            id="locandina"
            placeholder="Link della locandina"
          />
          <input type="text" id="titolo" placeholder="Titolo" />
          <input type="text" id="regista" placeholder="Regista" />
          <input type="number" id="anno" placeholder="Anno" />
          <select id="visto">
            <option value="no">Da vedere</option>
            <option value="si">Visto</option>
          </select>
          <button type="submit">Aggiungi</button>
        </form>
        <p id="errore"></p>
      </section>

      <section class="controlli">
        <input
          type="search"
          id="ricerca"
          placeholder="Cerca per titolo o regista"
        />
      </section>

      <section class="statistiche">
        <div class="contatore">
          <span id="num-totale">0</span>
          <p>Totale</p>
        </div>

        <div class="contatore">
          <span id="num-visti">0</span>
          <p>Visti</p>
        </div>

        <div class="contatore">
          <span id="num-da-vedere">0</span>
          <p>Da vedere</p>
        </div>

        <div class="barra">
          <div id="barra-visti"></div>
        </div>

        <p>Percentuale Visti</p>
      </section>

      <section class="lista">
        <div id="lista-film" class="griglia"></div>
      </section>

      <div id="notifica"></div>
    </main>

    <footer>
      <p>Pellicula, Gianluca Fatigati, 2026</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
