<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsHub — Eventi sportivi</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="fw-bold">SportsHub</h1>
      <p>Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

      <form id="form-ricerca" class="d-flex gap-2 mx-auto">
        <input
          type="text"
          id="input-ricerca"
          class="form-control"
          placeholder="es. Arsenal, Lakers, Real Madrid"
        />
        <button type="submit" class="btn btn-light fw-bold">Cerca</button>
      </form>
    </header>

    <main class="container">
      <section id="preferiti-section" class="mb-5">
        <h2 class="h4 fw-bold mb-3">⭐ Le tue squadre preferite</h2>

        <p id="messaggio-preferiti" class="fst-italic text-secondary">
          Non hai ancora salvato nessuna squadra. Cercane una qui sopra e
          aggiungila ai preferiti.
        </p>

        <div id="lista-preferiti" class="row g-3"></div>
      </section>
      <section id="risultati-section">
        <h2 class="h4 fw-bold mb-3">Squadre trovate</h2>

        <p id="messaggio-squadre" class="fst-italic text-secondary">
          Inizia cercando una squadra qui sopra
        </p>

        <div id="spinner" class="text-center my-4" hidden>
          <div class="spinner-border" role="status"></div>
        </div>

        <div id="errore" class="alert alert-danger" role="alert" hidden></div>

        <div id="lista-squadre" class="row g-3"></div>
      </section>

      <section
        id="dettagli-section"
        class="bg-white rounded shadow-sm p-4 mt-4"
        hidden
      >
        <h2 id="nome-squadra" class="h3 fw-bold mb-4"></h2>

        <div class="row g-4">
          <div class="col-12 col-md-6">
            <h3 class="h5 fw-bold titolo-eventi">Prossimi eventi</h3>
            <ul id="lista-prossimi" class="list-unstyled"></ul>
          </div>

          <div class="col-12 col-md-6">
            <h3 class="h5 fw-bold titolo-eventi">Ultimi risultati</h3>
            <ul id="lista-ultimi" class="list-unstyled"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
